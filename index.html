<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grow Partners - Apps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      padding: 0;
    }

    /* Header Section */
    .header {
      background-color: #fff;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 30px;
    }

    .logo span {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .menu-icon {
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Section Title */
    .section-title {
      font-size: 2rem;
      padding: 20px;
      font-weight: bold;
    }

    /* App Card */
    .app-card {
      background-color: #fff;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .app-header img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
    }

    .app-name {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .app-description {
      margin: 10px 0;
      font-size: 1rem;
    }

    .install-button {
      background-color: #1a73e8;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .screenshots {
      display: flex;
      overflow-x: auto;
      gap: 10px;
    }

    .screenshots img {
      height: 300px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .app-card {
        padding: 15px;
      }

      .app-name {
        font-size: 1.2rem;
      }

      .install-button {
        width: 100%;
      }

      .screenshots img {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/IOS_Glyph_Marketing_App_Icon.png" alt="logo">
      <span>Grow Partners</span>
    </div>
    <div class="menu-icon">&#9776;</div>
  </div>

  <!-- Section Title -->
  <div class="section-title">Apps</div>

  <!-- App Card Example -->
  <div class="app-card">
    <div class="app-header">
      <img src="https://seeklogo.com/images/U/uber-eats-logo-8FDEE4A380-seeklogo.com.png" alt="App Icon">
      <div class="app-name">Uber Eats: Food Delivery</div>
    </div>
    <div class="app-description">
      Just order online & eat. Food, takeaway & grocery delivery. Pizza, burger & more.
    </div>
    <button class="install-button">Install</button>
    <div class="screenshots">
      <img src="/mnt/data/WhatsApp Image 2025-09-29 at 14.42.48_9c2b283c.jpg" alt="Screenshot 1">
      <img src="/mnt/data/Screenshot 2025-09-29 144347.png" alt="Screenshot 2">
    </div>
  </div>

  <!-- You can duplicate the .app-card div for more apps -->

</body>
</html>
